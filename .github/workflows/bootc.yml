---
name: Run QEMU bootc image
on:  # yamllint disable-line rule:truthy
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  bootc:
    runs-on: ubuntu-latest

    steps:
      - name: Accio /dev/kvm 🪄
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle
          ls -l /dev/kvm

      - name: env info
        run: |
          free -t -h
          nproc
          df -h

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Disable man-db to speed up package install
        run: |
          echo "set man-db/auto-update false" | sudo debconf-communicate
          sudo dpkg-reconfigure man-db

      - name: Install test dependencies
        run: |
          set -euxo pipefail
          sudo apt update
          sudo apt install -y qemu-system-x86

      - name: Create bootc image
        run: sudo tests/files/build-bootc.sh

      - name: Run bootc image
        run: tests/files/run-bootc.sh

      #- uses: mxschmitt/action-tmate@v3
      #  if: failure()
